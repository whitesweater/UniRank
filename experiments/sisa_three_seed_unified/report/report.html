<style>

  .eyebrow{font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}

  .sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
  .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .button{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px 14px;font-size:13px;font-weight:650;white-space:nowrap}
  .button:hover{border-color:#9eb5d9;background:#f8faff}
  .button.primary{border-color:var(--ink);background:var(--ink);color:#fff}
  .button.primary:hover{background:#2d4363}
  .button.ghost{border-color:transparent;color:var(--muted)}
  .button:disabled{opacity:.42;cursor:not-allowed}
  .hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding:26px 0 20px}
  .hero p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
  .statline{display:flex;gap:20px;flex-wrap:wrap;justify-content:flex-end}
  .stat{min-width:110px;border-left:1px solid var(--line);padding-left:16px}
  .stat strong{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--soft);gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:7px 12px;border-radius:7px}
  .seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(16,36,67,.1)}
  .legend{display:flex;gap:14px;color:var(--muted);font-size:11px;flex-wrap:wrap;justify-content:flex-end}

  .swipe-tip{display:none}
  .green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}

  .matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:1090px;table-layout:fixed}

  .summary{display:none;border:1px solid var(--line);border-radius:14px;overflow:auto}
  .summary.active{display:block}
  .summary table{border-collapse:collapse;width:100%;min-width:1100px;font-variant-numeric:tabular-nums;font-size:12px}
  .summary th,.summary td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:right;white-space:nowrap}

  .summary small{display:block;color:var(--muted);font-size:10px}
  .summary-controls{display:none;align-items:center;justify-content:space-between;margin:14px 0;gap:8px;flex-wrap:wrap}

  .drawer-body{padding:20px 25px 28px;overflow:auto;flex:1}

csv","sha256":"1c2feefd4f052e0c4dee6c21a38239d4477e4b691d8641d4fb61a300199f8005"},{"file":"experiments/sisa_seed_variability_20260923/rerun/followup_20260923/results/label_comparison.csv","sha256":"39780d9756599f937341cd388ddffdd8826b68e6807c3c70924dcf6d5d413600"},{"file":"experiments/onetrans_seed_completion/results/selected_label_metrics.csv","sha256":"4132ef85736ad8a9b7ebd8734bb7c84c7f91b69346bbdbc3d1349b8580cdb5a2"},{"file":"experiments/onetrans_seed_completion/results/selected_runs.csv","sha256":"af1dd0676f50e13317f67513b701116ca17ea29ec9ac10e15fc882e85bd66203"},{"file":"experiments/sisa_native_strict/results/runs.csv","sha256":"7bad9e9bf86b4f012c0a74e9e73a5025a8e519f445b57fe59bd2e1f97086ff43"},{"file":"experiments/sisa_expansion_acd/results/runs.csv","sha256":"03d6213b05978f11d248be2fe6e351650faab130ae078ade1b5603ace3f18678"}]}</script>
<script>
(() => {
  "use strict";
  const catalog = JSON.parse(document.getElementById("catalog").textContent);
  const cells = catalog.cells;
  const byId = Object.fromEntries(cells.map(cell => [cell.id, cell]));
  const key = "unirank-sisa-three-seed-" + catalog.digest;
  const $ = id => document.getElementById(id);
  const esc = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
  const fmt = value => Number(value).toFixed(7);
  const signed = value => (value > 0 ? "+" : "") + Number(value).toFixed(7);
  const good = value => value > 0.00000005 ? "good" : value < -0.00000005 ? "bad" : "flat";
  const defaultFor = cell => Object.fromEntries([20262027,20262028,20262029].map(seed => [String(seed), cell.runs.find(run => run.seed === seed && run.kind === "original").id]));
  const defaults = Object.fromEntries(cells.map(cell => [cell.id, defaultFor(cell)]));
  const clone = value => JSON.parse(JSON.stringify(value));
  let choices = clone(defaults);
  let metric = "auc";
  let view = "matrix";
  let opened = null;
  let draft = null;
  let lastFocus = null;
  let toastTimer;

  function validCell(cell, selected) {
    if (!selected || Object.keys(selected).length !== 3) return false;
    return Object.entries(selected).every(([seed,id]) => cell.runs.some(run => String(run.seed) === seed && run.id === id));
  }
  function validAll(selection) {
    return selection && Object.keys(selection).length === cells.length && cells.every(cell => validCell(cell, selection[cell.id]));
  }
  try { const stored = JSON.parse(localStorage.getItem(key)); if (validAll(stored)) choices = stored; } catch {}
  function save() { try { localStorage.setItem(key, JSON.stringify(choices)); } catch {} }
  function runsFor(cell, selected = choices[cell.id]) {
    return Object.entries(selected).map(([seed,id]) => {
      const run = cell.runs.find(item => item.id === id && String(item.seed) === seed);
      if (!run) throw new Error("Invalid run selection for " + cell.id);
      return run;
    }).sort((a,b) => a.seed-b.seed);
  }
  function resultFor(cell, selected = choices[cell.id], field = metric) {
    const runs = runsFor(cell, selected);
    const mean = runs.reduce((sum,run) => sum + run[field],0) / 3;
    const baseline = cell.baseline[field];
    const improvement = field === "auc" ? mean-baseline : baseline-mean;
    return {runs,mean,baseline,improvement};
  }
  function toast(text) { clearTimeout(toastTimer); $("toast").textContent=text; $("toast").classList.add("show"); toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2700); }
  function updateStats() {
    const improvements = cells.map(cell => resultFor(cell,choices[cell.id],"auc").improvement);
    $("stat-cells").textContent=cells.length;
    $("stat-runs").textContent=cells.length*3;
    $("stat-positive").textContent=improvements.filter(value=>value>0).length+" / "+cells.length;
    $("stat-delta").textContent=signed(improvements.reduce((a,b)=>a+b,0)/cells.length);
  }
  function renderMatrix() {
    let output='<thead><tr><th scope="col">模型</th>'+catalog.datasets.map(ds=>'<th scope="col">'+esc(ds.name)+'</th>').join("")+'</tr></thead><tbody>';
    for (const model of catalog.models) {
      output+='<tr><th scope="row" class="row-name">'+esc(model)+'</th>';
      for (const dataset of catalog.datasets) {
        const cell=byId[model+"|"+dataset.id];
        const result=resultFor(cell);
        const chosen=result.runs;
        const extra=chosen.some(run=>run.seed===20262030);
        const repeated=chosen.some(run=>run.kind==="rerun");
        output+='<td><button class="cell" data-cell-id="'+esc(cell.id)+'" aria-label="选择 '+esc(model)+' '+esc(dataset.name)+' 的三种子结果">'+
          '<div class="cell-top"><span>BASELINE '+fmt(result.baseline)+'</span><span aria-hidden="true">↗</span></div>'+
          '<div class="cell-value">'+fmt(result.mean)+'</div>'+
          '<span class="delta '+good(result.improvement)+'">'+(result.improvement>=0?'▲ ':'▼ ')+signed(result.improvement)+'</span>'+
          '<div class="seeds">'+chosen.map(run=>'<span class="seed '+(run.kind==="rerun"?'repeated ':"")+(run.seed===20262030?'extra':'')+'">'+String(run.seed).slice(-2)+(run.kind==="rerun"?' · R':'')+'</span>').join("")+'</div>'+
          '</button></td>';
      }
      output+='</tr>';
    }
    $("matrix").innerHTML=output+'</tbody>';
  }
  function renderSummary() {
    let output='<table><thead><tr><th>模型</th><th>数据集</th><th>Baseline</th><th>种子 1</th><th>种子 2</th><th>种子 3</th><th>三次均值</th><th>改善</th></tr></thead><tbody>';
    for (const cell of cells) {
      const result=resultFor(cell);
      output+='<tr data-cell-id="'+esc(cell.id)+'"><td>'+esc(cell.model)+'</td><td>'+esc(cell.dataset_name)+'</td><td>'+fmt(result.baseline)+'</td>'+
        result.runs.map(run=>'<td><small>'+run.seed+(run.kind==="rerun"?' · 复跑':'')+'</small>'+fmt(run[metric])+'</td>').join("")+
        '<td><strong>'+fmt(result.mean)+'</strong></td><td class="'+(result.improvement>=0?'green':'red')+'">'+signed(result.improvement)+'</td></tr>';
    }
    $("summary-view").innerHTML=output+'</tbody></table>';
  }
  function render() {
    updateStats(); renderMatrix(); renderSummary();
    $("matrix-view").style.display=view==="matrix"?"block":"none";
    $("summary-controls").classList.toggle("active",view==="summary");
    $("summary-view").classList.toggle("active",view==="summary");
    $("view-toggle").textContent=view==="matrix"?"最终汇总表":"返回选择矩阵";
    document.querySelectorAll("[data-metric]").forEach(button=>button.classList.toggle("active",button.dataset.metric===metric));
  }
  function plot(cell, selected) {
    const runs=runsFor(cell,selected);
    const series=[{name:"Baseline",value:cell.baseline[metric]},...runs.map(run=>({name:String(run.seed).slice(-2)+(run.kind==="rerun"?' R':''),value:run[metric]}))];
    const vals=series.map(p=>p.value),min=Math.min(...vals),max=Math.max(...vals),spread=Math.max(max-min,0.000001);
    return '<div class="plot"><h3>'+esc(metric==="auc"?'AUC 对照':'LogLoss 对照')+'</h3>'+series.map((point,i)=>{
      const left=8+84*(point.value-min)/spread;
      return '<div class="plot-row '+(i?'choice':'')+'"><span>'+esc(point.name)+'</span><div class="plot-track"><i style="left:calc('+left.toFixed(2)+'% - 7px)"></i></div><strong>'+fmt(point.value)+'</strong></div>';
    }).join("")+'</div>';
  }
  function renderDrawer() {
    if (!opened) return;
    const cell=byId[opened], selectedCount=Object.keys(draft).length;
    $("drawer-title").textContent=cell.model+" / "+cell.dataset_name;
    const base=cell.baseline;
    let output='<div class="baseline-strip"><div><span class="eyebrow">BASELINE / 固定</span><small>seed '+base.seed+' · 作业 '+esc(base.job)+'</small></div><div><strong>AUC '+fmt(base.auc)+'</strong><small>LogLoss '+fmt(base.logloss)+'</small></div></div>'+
      '<p class="drawer-hint">选择恰好三个不同实验 seed；同一 seed 有多次运行时，选择其中一条。</p>';
    const seeds=[...new Set(cell.runs.map(run=>run.seed))].sort();
    for (const seed of seeds) {
      const available=cell.runs.filter(run=>run.seed===seed),chosen=draft[String(seed)];
      output+='<div class="seed-group '+(chosen?'selected':'')+'"><label class="seed-group-head"><input type="checkbox" data-seed="'+seed+'" '+(chosen?'checked':'')+'><span>seed '+seed+'</span><span class="tag">'+(available.length>1?available.length+' 次有效运行':'1 次有效运行')+'</span></label>';
      if(chosen) output+='<div class="run-options">'+available.map(run=>'<button type="button" class="run-choice '+(chosen===run.id?'active':'')+'" data-run-id="'+esc(run.id)+'"><span class="radio-dot"></span><span class="run-copy"><b>'+({original:'原始',rerun:'复跑',new_seed:'新增种子'}[run.kind]||run.kind)+'</b><small>作业 '+esc(run.job)+'</small></span><span class="run-values">AUC '+fmt(run.auc)+'<small>LogLoss '+fmt(run.logloss)+'</small></span></button>').join("")+'</div>';
      output+='</div>';
    }
    if(selectedCount===3)output+=plot(cell,draft);
    $("drawer-body").innerHTML=output;
    $("apply-cell").disabled=selectedCount!==3;
    $("drawer-message").textContent=selectedCount===3?'':`已选 ${selectedCount}/3 个 seed`;
  }
  function openDrawer(id) {
    opened=id; draft=clone(choices[id]); lastFocus=document.activeElement;
    $("veil").classList.add("open"); $("drawer").classList.add("open");
    document.body.style.overflow="hidden";renderDrawer();$("close-drawer").focus();
  }
  function closeDrawer() {
    $("veil").classList.remove("open");$("drawer").classList.remove("open");
    document.body.style.overflow="";opened=null;draft=null;
    if(lastFocus && document.contains(lastFocus))lastFocus.focus();
  }
  function download(name,content,type) {
    const blob=new Blob(["\ufeff",content],{type});const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  function finalRows() {
    return cells.map(cell=>({cell,selected:runsFor(cell),auc:resultFor(cell,choices[cell.id],"auc"),logloss:resultFor(cell,choices[cell.id],"logloss")}));
  }
  function exportMarkdown() {
    const rows=finalRows(),lines=['# SISA 最终三种子结果','','每个模型×数据集使用一个历史 Baseline 和三个不同实验 seed。Baseline 仅有 seed20262027 一次；同种子的原始运行或复跑按本次选择取其一。AUC 越高越好，LogLoss 越低越好。','','| 模型 | 数据集 | Baseline AUC | 种子 1 AUC | 种子 2 AUC | 种子 3 AUC | 三种子 AUC | ΔAUC | Baseline LogLoss | 种子 1 LogLoss | 种子 2 LogLoss | 种子 3 LogLoss | 三种子 LogLoss | LogLoss 改善 |','|---|---|---:|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|'];
    for(const {cell,selected,auc,logloss} of rows)lines.push('| '+[cell.model,cell.dataset_name,fmt(auc.baseline),...selected.map(run=>run.seed+' '+fmt(run.auc)+(run.kind==='rerun'?'（复跑）':'')),fmt(auc.mean),signed(auc.improvement),fmt(logloss.baseline),...selected.map(run=>fmt(run.logloss)),fmt(logloss.mean),signed(logloss.improvement)].join(' | ')+' |');
    lines.push('','## 最终选择的运行','','| 模型 | 数据集 | seed | 类型 | 作业 | AUC | LogLoss |','|---|---|---:|---|---|---:|---:|');
    for(const {cell,selected} of rows)for(const run of selected)lines.push('| '+[cell.model,cell.dataset_name,run.seed,run.kind,run.job,fmt(run.auc),fmt(run.logloss)].join(' | ')+' |');
    lines.push('','## 标签结果','','每个标签按所选三次运行等权求均值。','','| 模型 | 数据集 | 标签 | Baseline AUC | seed 1 AUC | seed 2 AUC | seed 3 AUC | 平均 AUC | Baseline LogLoss | seed 1 LogLoss | seed 2 LogLoss | seed 3 LogLoss | 平均 LogLoss |','|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|');
    for(const {cell,selected} of rows)for(const base of cell.baseline.labels){const vals=selected.map(run=>run.labels.find(label=>label.label===base.label));const ma=vals.reduce((s,x)=>s+x.auc,0)/3,ml=vals.reduce((s,x)=>s+x.logloss,0)/3;lines.push('| '+[cell.model,cell.dataset_name,base.label,fmt(base.auc),...vals.map(v=>fmt(v.auc)),fmt(ma),fmt(base.logloss),...vals.map(v=>fmt(v.logloss)),fmt(ml)].join(' | ')+' |');}
    lines.push('','本表是所选三种子的描述性结果；它不自动替换原始实验记录。');
    return lines.join('\n')+'\n';
  }
  function exportCsv() {
    const fields=['model','dataset','baseline_auc','seed1','run1','auc1','logloss1','seed2','run2','auc2','logloss2','seed3','run3','auc3','logloss3','mean_auc','delta_auc','baseline_logloss','mean_logloss','logloss_improvement'];
    const quote=value=>'"'+String(value).replaceAll('"','""')+'"';
    const rows=finalRows().map(({cell,selected,auc,logloss})=>[cell.model,cell.dataset,fmt(auc.baseline),...selected.flatMap(run=>[run.seed,run.job,fmt(run.auc),fmt(run.logloss)]),fmt(auc.mean),signed(auc.improvement),fmt(logloss.baseline),fmt(logloss.mean),signed(logloss.improvement)]);
    return [fields.map(quote).join(','),...rows.map(row=>row.map(quote).join(','))].join('\n')+'\n';
  }
  $("matrix").addEventListener("click",event=>{const button=event.target.closest('[data-cell-id]');if(button)openDrawer(button.dataset.cellId);});
  $("summary-view").addEventListener("click",event=>{const row=event.target.closest('[data-cell-id]');if(row)openDrawer(row.dataset.cellId);});
  document.querySelectorAll('[data-metric]').forEach(button=>button.addEventListener('click',()=>{metric=button.dataset.metric;render();if(opened)renderDrawer();}));
  $("view-toggle").addEventListener("click",()=>{view=view==='matrix'?'summary':'matrix';render();});
  $("drawer-body").addEventListener("change",event=>{const control=event.target.closest('[data-seed]');if(!control)return;const seed=control.dataset.seed,cell=byId[opened];if(control.checked){if(Object.keys(draft).length>=3){control.checked=false;$("drawer-message").textContent='请先取消一个种子';return;}draft[seed]=cell.runs.find(run=>String(run.seed)===seed).id;}else delete draft[seed];renderDrawer();});
  $("drawer-body").addEventListener("click",event=>{const button=event.target.closest('[data-run-id]');if(!button)return;const run=byId[opened].runs.find(item=>item.id===button.dataset.runId);if(run){draft[String(run.seed)]=run.id;renderDrawer();}});
  $("apply-cell").addEventListener("click",()=>{if(!validCell(byId[opened],draft))return;choices[opened]=clone(draft);save();closeDrawer();render();toast('已更新此组合的三个种子');});
  $("reset-cell").addEventListener("click",()=>{draft=defaultFor(byId[opened]);renderDrawer();});
  $("close-drawer").addEventListener("click",closeDrawer);$("veil").addEventListener("click",closeDrawer);
  document.addEventListener("keydown",event=>{if(event.key==='Escape'&&opened)closeDrawer();});
  $("reset-all").addEventListener("click",()=>{choices=clone(defaults);save();render();toast('已恢复原始 seed27 / 28 / 29');});
  $("download-report").addEventListener("click",()=>download('sisa_final_three_seed_report.md',exportMarkdown(),'text/markdown;charset=utf-8'));
  $("download-csv").addEventListener("click",()=>download('sisa_final_three_seed_cells.csv',exportCsv(),'text/csv;charset=utf-8'));
  $("download-selection").addEventListener("click",()=>download('sisa_three_seed_selection.json',JSON.stringify({version:1,catalog_digest:catalog.digest,selected_at:new Date().toISOString(),choices},null,2)+'\n','application/json;charset=utf-8'));
  $("import-selection").addEventListener("click",()=>$('import-file').click());
  $("import-file").addEventListener("change",async event=>{const file=event.target.files?.[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(imported.catalog_digest!==catalog.digest||!validAll(imported.choices))throw new Error('选择文件与当前结果不匹配');choices=clone(imported.choices);save();render();toast('已导入 20 组选择');}catch(error){toast(error.message||'导入失败');}event.target.value='';});
  render();
})();
</script>
