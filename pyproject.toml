[project]
name = "unirank-benchmark"
version = "0.7.2"
description = "Local reproducible environment for the UniRank benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py",
    "heavyball==3.2.0",
    "huggingface-hub",
    "keras-preprocessing",
    "numpy",
    "pandas==2.3.3",
    "polars<=1.0.0",
    "pyarrow",
    "pyyaml",
    "scikit-learn",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "tqdm",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
